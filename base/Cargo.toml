[package]
name    = "hace-brain-base"
version = "0.1.0"
edition = "2021"
publish = false
description = "Brain base kernel — BrainKernel + BrainRuntime (Zeus CE interface)"

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
async-trait = "0.1"
thiserror   = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = []
std     = []
algo    = []   # CE.Algo — deterministic, no LLM
llm     = []   # CE.Hacedle / CE.Llama bridge features
